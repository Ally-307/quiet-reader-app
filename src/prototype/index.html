<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" />
    <link rel="icon" type="image/png" href="./assets/quiet-reader-logo.png" />
    <title>Android 阅读器 v0</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-stage">
      <section class="phone-shell" aria-label="Android 阅读器交互原型">
        <div class="phone-screen" id="phone-screen">
          <div class="status-bar" aria-hidden="true">
            <span>20:36</span>
            <span class="status-icons">
              <i data-lucide="signal" aria-hidden="true"></i>
              <i data-lucide="wifi" aria-hidden="true"></i>
              <i data-lucide="battery-medium" aria-hidden="true"></i>
            </span>
          </div>
          <div id="app-root"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </section>

      <button class="tweaks-trigger icon-button" id="tweaks-trigger" type="button" aria-label="打开原型参数" title="打开原型参数">
        <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
      </button>

      <aside class="tweaks-panel" id="tweaks-panel" aria-label="Tweaks" hidden>
        <div class="tweaks-heading">
          <strong>Tweaks</strong>
          <button class="icon-button small" id="tweaks-close" type="button" aria-label="关闭" title="关闭">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
        <label class="tweak-group">
          <span>书架密度</span>
          <select id="density-select">
            <option value="airy">疏朗</option>
            <option value="balanced" selected>平衡</option>
            <option value="compact">紧凑</option>
          </select>
        </label>
        <label class="tweak-toggle">
          <span>纸张肌理</span>
          <input id="texture-toggle" type="checkbox" checked />
        </label>
        <label class="tweak-toggle">
          <span>动效预览</span>
          <input id="motion-toggle" type="checkbox" />
        </label>
      </aside>
    </main>

    <script src="./node_modules/lucide/dist/umd/lucide.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
